# Tooling configuration only: the plugin is not a Python package and has no
# runtime dependencies. Hook scripts run on Python 3.8+; the test suite needs
# 3.11+ (tomllib).
[project]
name = "argon-orchestrator"
version = "2.0.0"
description = "Antigravity (agy)-only orchestration hooks: a frontier primary model routes subagents to flash or flash_lite"
requires-python = ">=3.8"
license = "MIT"
dependencies = []

[tool.ruff]
target-version = "py38"
line-length = 160
extend-exclude = ["assets"]

[tool.ruff.lint]
# Correctness only: syntax errors, undefined names, unused imports and variables.
select = ["E9", "F"]
